services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: enterprise_sales_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      # Use the psycopg3 URL scheme to match requirements.txt.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/enterprise_sales_agent
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    working_dir: /app

  campaign-worker:
    # Same image as ``backend`` — runs the campaign execution loop.
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    command: ["python", "-m", "app.workers", "campaigns", "--interval", "30"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/enterprise_sales_agent
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
    depends_on:
      db:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Web UI
      - "14268"        # HTTP Thrift
      - "14250"        # gRPC
    profiles: ["observability"]

volumes:
  postgres_data:
  uploads:
